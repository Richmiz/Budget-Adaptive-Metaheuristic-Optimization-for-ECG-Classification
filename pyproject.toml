[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamo"
version = "0.1.0"
description = "Budget-adaptive metaheuristic optimization for ECG classification (PTB-XL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
data = ["pandas>=2.1", "wfdb>=4.1"]
train = ["torch>=2.4"]                       # install the CUDA build separately, see README
hpo = ["optuna>=4.0", "dehb", "ConfigSpace"]  # pin exact versions after the first install (D27)
analysis = ["scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
